:root{--plum:#2e1f33;--plum2:#463050;--pink:#f2709e;--hot:#e04a85;--blush:#fad2df;--soft:#fce3eb;
--cream:#fffbf7;--paper:#fff3f6;--muted:#8a6b80;--lilac:#c9a6e8;--u:4px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 10%,#4a3155 0%,var(--plum) 60%,#1d1320 100%);color:var(--plum);
font-family:'Fredoka',ui-rounded,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;
display:flex;flex-direction:column;align-items:center;justify-content:center;padding-inline:16px}
.stars{position:fixed;inset:0;pointer-events:none}
.stars i{position:absolute;width:6px;height:6px;background:var(--blush);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:.8;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.2;transform:scale(.6)}}
.stage{position:relative;perspective:2400px;margin-top:4px}
.book{position:relative;width:calc(var(--u)*100);height:calc(var(--u)*142);transform-style:preserve-3d}
.page,.cover{position:absolute;inset:0;border-radius:calc(var(--u)*1.2) calc(var(--u)*3) calc(var(--u)*3) calc(var(--u)*1.2);
transform-origin:left center;transition:transform .9s cubic-bezier(.45,.05,.25,1),box-shadow .9s;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.page{background:linear-gradient(90deg,#f6dfe6 0,var(--paper) 4%,var(--paper) 100%);box-shadow:0 calc(var(--u)*2) calc(var(--u)*6) rgba(0,0,0,.35);
padding:calc(var(--u)*7) calc(var(--u)*7) calc(var(--u)*9) calc(var(--u)*9);overflow:hidden;display:flex;flex-direction:column}
.page.turned{transform:rotateY(-178deg);box-shadow:none;pointer-events:none}
.page::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(46,31,51,.12),transparent 8%)}
.web{position:absolute;width:calc(var(--u)*22);opacity:.55;pointer-events:none}
.web.tl{top:0;left:calc(var(--u)*2)}.web.br{bottom:0;right:0;transform:rotate(180deg)}
.ph{text-align:center;margin-bottom:calc(var(--u)*3)}
.ph svg{width:calc(var(--u)*9);height:calc(var(--u)*9)}
.ph h2{font-family:'Sniglet',sans-serif;font-weight:800;font-size:calc(var(--u)*6.4);margin:calc(var(--u)*.5) 0 0;line-height:1.05;text-wrap:balance}
.ph p{margin:calc(var(--u)*1) 0 0;color:var(--hot);font-size:calc(var(--u)*3.2)}
.items{display:flex;flex-direction:column;gap:calc(var(--u)*2.2);flex:1;min-height:0}
.card{position:relative;display:flex;gap:calc(var(--u)*2.4);align-items:flex-start;background:var(--cream);border:calc(var(--u)*.35) solid var(--blush);
border-radius:calc(var(--u)*3);padding:calc(var(--u)*2.4) calc(var(--u)*3);font-size:calc(var(--u)*3.35);line-height:1.35;color:var(--plum)}
button.card{width:100%;text-align:left;padding-bottom:calc(var(--u)*5);font:inherit;font-size:calc(var(--u)*3.35);cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
button.card:hover{border-color:var(--pink)}button.card:active{transform:scale(.98)}

 pumpkin:`<svg viewBox="0 0 100 90" aria-hidden="true"><rect x="46" y="4" width="8" height="18" rx="3" fill="#7fb283"/><ellipse cx="66" cy="12" rx="13" ry="5" fill="#7fb283"/><g fill="#f2709e" stroke="#e04a85" stroke-width="2.5"><ellipse cx="30" cy="55" rx="24" ry="30"/><ellipse cx="70" cy="55" rx="24" ry="30"/><ellipse cx="42" cy="55" rx="20" ry="31"/><ellipse cx="58" cy="55" rx="20" ry="31"/><ellipse cx="50" cy="55" rx="16" ry="31"/></g></svg>`,
 web:`<svg viewBox="0 0 100 100" aria-hidden="true" fill="none" stroke="#f2709e" stroke-width="1.5"><path d="M0 0L100 0M0 0L95 40M0 0L70 70M0 0L40 95M0 0L0 100"/><path d="M30 0Q28 12 29 12Q20 20 21 21Q12 27 12 29Q2 30 0 30"/><path d="M60 0Q56 24 57 24Q40 40 42 42Q24 56 24 57Q4 60 0 60"/><path d="M90 0Q84 36 86 36Q60 60 63 63Q36 84 36 86Q6 90 0 90"/></svg>`,
 lock:`<svg viewBox="0 0 60 70" aria-hidden="true"><path class="shackle" d="M16 32V20a14 14 0 0 1 28 0v12" fill="none" stroke="#fffbf7" stroke-width="7" stroke-linecap="round"/><path d="M30 68C14 56 4 47 4 36a12 12 0 0 1 26-6 12 12 0 0 1 26 6c0 11-10 20-26 32z" fill="#fffbf7"/><circle cx="30" cy="42" r="5" fill="#e04a85"/></svg>`
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY = BOOK.id + '-profile';
let profile = {name:'', title:'', photo:''};
try { profile = Object.assign(profile, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
function saveProfile(){ try { localStorage.setItem(KEY, JSON.stringify(profile)); } catch (e) {} }
function avatarStyle(){ return profile.photo ? `background-image:url(${profile.photo})` : ''; }
function avatarInner(){ return profile.photo ? '' : ART.ghost; }

const sections = [];
BOOK.pages.forEach((p, i) => { if (p.section) sections.push([p.section, i]); });

function pageHTML(p, i){
  const head = p.title ? `<div class="ph">${ART[p.icon || 'ghost']}<h2>${esc(p.title)}</h2>${p.sub ? `<p>${esc(p.sub)}</p>` : ''}</div>` : '';
  let body = '';
  if (p.type === 'belongs') {
    body = `<div class="belong"><div class="lbl">This book belongs to</div><div class="avatar" data-av style="${avatarStyle()}">${avatarInner()}</div>
      <h3 data-name>${esc(profile.name || 'You!')}</h3><div class="ttl" data-title>${esc(profile.title || 'Spooky season superstar')}</div>
      <button class="btn ghost" data-me type="button">Add my photo & name</button></div>`;
  } else if (p.type === 'list') {
    body = `<div class="items">` + p.items.map((t, k) => `<div class="card"><span class="num">${k + 1}</span><span>${esc(t)}</span></div>`).join('') + `</div>`;
  } else if (p.type === 'formula') {
    body = `<div class="ph">${ART.pumpkin}<h2>The Magic Formula</h2><p>Write your own prompts</p></div>
      <div class="formula">Act as a <b>[role]</b>. Help me <b>[goal]</b> for <b>[audience]</b>. Make it <b>[tone]</b> and give me <b>[number]</b> options in <b>[format]</b>.
      <p>Example: Act as a social media expert. Help me write captions for teen girls. Make them cute and funny and give me 10 options in a list.</p></div>
      <button class="card" style="margin-top:calc(var(--u)*4)" data-copy="Act as a [role]. Help me [goal] for [audience]. Make it [tone] and give me [number] options in [format]."><span class="num">&#10024;</span><span>Tap to copy the formula</span></button>`;
  } else if (p.type === 'contents') {
    body = `<div class="ph">${ART.bat}<h2>Contents</h2><p>Tap a section to jump there</p></div><div class="toc">` +
      sections.map(([name, idx]) => `<button type="button" data-go="${idx}">${esc(name)} <span>p. ${idx + 1}</span></button>`).join('') + `</div>`;
  } else if (p.type === 'prompts') {
    body = `<div class="items">` + p.items.map(it => `<button class="card" type="button" data-copy="${esc(it.text)}"><span class="num">${it.n}</span><span>${it.label ? `<span class="lab">${esc(it.label)}</span>` : ''}${esc(it.text)}</span><span class="copy">tap to copy</span></button>`).join('') + `</div>`;
  } else if (p.type === 'reels') {
    body = `<div class="items">` + p.items.map(it => `<div class="card reel"><span class="num">${it.n}</span><span><b>${esc(it.name)}</b><span>Film: ${esc(it.film)}</span><em>On-screen text: ${esc(it.text)}</em></span></div>`).join('') + `</div>`;
  } else if (p.type === 'plan') {
    body = `<div class="items plan">` + p.items.map(([d, a, b]) => `<div class="card"><span class="day">${d}</span><span><b>${esc(a)}</b><small>${esc(b)}</small></span></div>`).join('') + `</div>`;
  } else if (p.type === 'end') {
    body = `<div class="end">${ART.ghost}<div class="big">Thank you!</div><p>Thank you for shopping with DigiByDK. Tag <b>@digibydk</b> when you use your book. I&#8217;d love to see it!</p><button class="btn" type="button" data-go="0">Back to the start</button></div>`;
  }
  return `<img class="web tl" alt="" src="data:image/svg+xml;utf8,${encodeURIComponent(ART.web)}"><img class="web br" alt="" src="data:image/svg+xml;utf8,${encodeURIComponent(ART.web)}">${p.type === 'formula' ? '' : head}${body}<div class="pfoot">${i + 1} &middot; &copy; 2026 DigiByDK &middot; personal use only</div>`;
}

const book = $('#book');
const pages = BOOK.pages.map((p, i) => {
  const el = document.createElement('section');
  el.className = 'page'; el.style.zIndex = 400 - i; el.innerHTML = pageHTML(p, i);
  el.setAttribute('aria-label', `Page ${i + 1}`);
  book.appendChild(el); return el;
});
const cover = document.createElement('div');
cover.className = 'cover';
cover.innerHTML = `<span class="corner a"></span><span class="corner b"></span><span class="moon"></span>
  <div class="kick">DigiByDK presents</div><h1>${esc(BOOK.kicker)}</h1><div class="scr">${esc(BOOK.script)}</div><div class="pill">${esc(BOOK.pill)}</div>
  <div class="who"><div class="avatar" data-av style="${avatarStyle()}">${avatarInner()}</div><div><b data-name>${esc(profile.name || 'Your name here')}</b><small data-title>${esc(profile.title || 'tap My book')}</small></div></div>
  <div class="ghosts">${ART.ghost}${ART.ghost}</div>
  <button class="tap" id="unlock" type="button">Tap to unlock</button><div class="brand">DigiByDK</div>
  <div class="strap" aria-hidden="true">${ART.lock}</div>`;
book.appendChild(cover);

let idx = 0, opened = false;
function render(){
  pages.forEach((el, i) => el.classList.toggle('turned', i < idx));
  $('#pg').textContent = `${idx + 1} / ${pages.length}`;
  $('#prev').disabled = idx === 0; $('#next').disabled = idx === pages.length - 1;
}
function go(n){ idx = Math.max(0, Math.min(pages.length - 1, n)); render(); }
function refreshProfile(){
  document.querySelectorAll('[data-av]').forEach(el => { el.style.backgroundImage = profile.photo ? `url(${profile.photo})` : ''; el.innerHTML = avatarInner(); });
  document.querySelectorAll('[data-name]').forEach(el => el.textContent = profile.name || (el.closest('.cover') ? 'Your name here' : 'You!'));
  document.querySelectorAll('[data-title]').forEach(el => el.textContent = profile.title || (el.closest('.cover') ? 'tap My book' : 'Spooky season superstar'));
}

function burst(){
  const b = document.createElement('div'); b.className = 'burst';
  for (let k = 0; k < 18; k++) { const i = document.createElement('i'); const a = k / 18 * Math.PI * 2, r = 120 + Math.random() * 90;
    i.style.setProperty('--x', Math.cos(a) * r + 'px'); i.style.setProperty('--y', Math.sin(a) * r + 'px'); b.appendChild(i); }
  book.appendChild(b); setTimeout(() => b.remove(), 1000);
}
function unlock(){
  if (opened) return; opened = true;
  cover.classList.add('unlocking');
  setTimeout(() => { cover.classList.add('unlocked'); burst(); }, 450);
  setTimeout(() => { cover.classList.add('open'); $('#bar').classList.add('on'); render();
    if (!profile.name && !profile.photo) setTimeout(openSheet, 900); }, 900);
}
$('#unlock').addEventListener('click', unlock);
cover.querySelector('.strap').addEventListener('click', unlock);

$('#prev').addEventListener('click', () => go(idx - 1));
$('#next').addEventListener('click', () => go(idx + 1));
$('#tocBtn').addEventListener('click', () => { const c = BOOK.pages.findIndex(p => p.type === 'contents'); go(c); });
document.addEventListener('keydown', e => { if (!opened || !$('#sheet').hidden) return;
  if (e.key === 'ArrowRight') go(idx + 1); if (e.key === 'ArrowLeft') go(idx - 1); });
let sx = null, sy = null;
book.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
book.addEventListener('touchend', e => { if (sx === null || !opened) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) go(idx + (dx < 0 ? 1 : -1)); sx = null; }, {passive:true});

const toast = $('#toast');
let tt;
function showToast(t){ toast.textContent = t; toast.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('on'), 1800); }
function fallbackCopy(text){
  const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); return ok;
}
book.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]');
  if (c) { const text = c.getAttribute('data-copy');
    const done = () => { c.classList.add('copied'); setTimeout(() => c.classList.remove('copied'), 900); showToast('Copied! Paste it anywhere ✨'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => { fallbackCopy(text) ? done() : showToast('Press and hold to copy'); });
    else (fallbackCopy(text) ? done() : showToast('Press and hold to copy'));
    return; }
  const g = e.target.closest('[data-go]'); if (g) { go(+g.getAttribute('data-go')); return; }
  if (e.target.closest('[data-me]')) openSheet();
});

// Personalize sheet
const sheet = $('#sheet'), pAv = $('#pAvatar'), pFile = $('#pFile');
let draftPhoto = '';
function openSheet(){ draftPhoto = profile.photo; $('#pName').value = profile.name; $('#pTitle').value = profile.title;
  pAv.style.backgroundImage = draftPhoto ? `url(${draftPhoto})` : ''; pAv.innerHTML = draftPhoto ? '' : ART.ghost; sheet.hidden = false; }
function closeSheet(){ sheet.hidden = true; }
$('#meBtn').addEventListener('click', openSheet);
$('#pPick').addEventListener('click', () => pFile.click());
pAv.addEventListener('click', () => pFile.click());
pFile.addEventListener('change', () => {
  const f = pFile.files && pFile.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => {
      const s = 320, cv = document.createElement('canvas'); cv.width = cv.height = s; const cx = cv.getContext('2d');
      const m = Math.min(img.width, img.height); cx.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
      draftPhoto = cv.toDataURL('image/jpeg', .85); pAv.style.backgroundImage = `url(${draftPhoto})`; pAv.innerHTML = ''; };
    img.src = r.result; };
  r.readAsDataURL(f);
});
$('#pSkip').addEventListener('click', closeSheet);
$('#pSave').addEventListener('click', () => { profile = {name: $('#pName').value.trim(), title: $('#pTitle').value.trim(), photo: draftPhoto};
  saveProfile(); refreshProfile(); closeSheet(); showToast('Your book is all yours ✨'); });

// Fit the book to the screen.
function fit(){ const vw = Math.min(window.innerWidth - 32, 560), vh = window.innerHeight - 96;
  const u = Math.max(2.4, Math.min(vw / 100, vh / 142)); document.documentElement.style.setProperty('--u', u + 'px'); }
window.addEventListener('resize', fit); fit();
const st = $('#stars');
for (let k = 0; k < 40; k++) { const i = document.createElement('i'); i.style.left = Math.random() * 100 + '%'; i.style.top = Math.random() * 100 + '%';
  i.style.animationDelay = Math.random() * 3 + 's'; i.style.transform = `scale(${.5 + Math.random()})`; st.appendChild(i); }
render();
</script>

</body>
</html>
