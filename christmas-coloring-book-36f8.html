<html lang="en"><head><meta charset="utf-8">

<title>Gingerbread Christmas Coloring · DigiByDK</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff8fc7;--deep:#c2457e;--lav:#b9a7ff;--cream:#fff7fb;--ink:#4a2a3d;--accent:#ff8fc7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Fredoka,system-ui,sans-serif;color:var(--ink);background:
 radial-gradient(circle at 20% 10%,#ffe3f1 0,transparent 40%),radial-gradient(circle at 90% 80%,#e9e1ff 0,transparent 45%),var(--cream);min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px}
h1{font-family:'Luckiest Guy',cursive;font-size:clamp(20px,4vw,34px);margin:0;color:var(--deep);
 text-shadow:3px 3px 0 #fff,5px 5px 0 rgba(194,69,126,.25);letter-spacing:1px}
.brand{font-weight:600;color:var(--deep);opacity:.8}
.wrap{display:grid;grid-template-columns:1fr minmax(0,620px) 1fr;gap:14px;padding:0 12px 18px;max-width:1300px;margin:0 auto}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}}
.panel{background:#fff;border-radius:24px;padding:12px;box-shadow:0 10px 30px rgba(194,69,126,.15);border:3px solid #ffd6e8}
.stage{position:relative;background:#fff;border-radius:22px;overflow:hidden;touch-action:none;box-shadow:0 14px 40px rgba(194,69,126,.22);border:4px solid #fff}
.stage canvas{display:block;width:100%;height:auto}
#view{cursor:crosshair}
.title{text-align:center;font-family:'Luckiest Guy';font-size:24px;color:var(--deep);margin:6px 0 10px}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{border:none;border-radius:16px;padding:10px 12px;font:600 15px Fredoka;background:#ffe7f2;color:var(--ink);cursor:pointer;
 box-shadow:0 4px 0 #f3b5d1;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #f3b5d1}
.btn.on{background:var(--deep);color:#fff;box-shadow:0 4px 0 #8f2c5a}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:10px}
.sw button{aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #f1d4e2;cursor:pointer}
.sw button.on{box-shadow:0 0 0 4px var(--deep);transform:scale(1.1)}
.label{font-weight:600;font-size:13px;margin:12px 0 4px;color:var(--deep);text-transform:uppercase;letter-spacing:1px}
.stickers{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-size:26px;text-align:center}
.stickers span{cursor:pointer;border-radius:12px;padding:2px}
.stickers span.on{background:#ffe0ee}
.pages{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:70vh;overflow:auto;padding:4px}
@media(max-width:1000px){.pages{grid-template-columns:repeat(8,1fr);max-height:none}}
.pages img{width:100%;border-radius:10px;border:3px solid #ffe0ee;cursor:pointer;background:#fff}
.pages img.on{border-color:var(--deep)}
.ex{position:absolute;right:10px;bottom:10px;width:24%;border-radius:12px;border:3px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.2);display:none}
.size{width:100%}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:9}
.foot{text-align:center;font-size:12px;opacity:.7;padding:10px}
@media print{body *{visibility:hidden}#printimg,#printimg *{visibility:visible}#printimg{position:fixed;inset:0;width:100%;}}
#printimg{display:none}
@media print{#printimg{display:block}}
</style></head><body>

const COLORS=["#ff4d6d","#ff8fab","#ffb3c6","#ff9f1c","#ffd166","#fff3b0","#06d6a0","#80ed99","#118ab2","#90e0ef","#7b2cbf","#c77dff",

const STK=["\ud83c\udf84", "\ud83c\udf81", "\u2b50", "\u2744", "\ud83c\udf6a", "\u2603", "\ud83e\udd8c", "\ud83d\udd14", "\ud83c\udf80", "\u2728", "\ud83d\udc96", "\ud83e\udde6"];
const W=900,H=1030;
const view=document.getElementById('view'),vx=view.getContext('2d');
const col=document.createElement('canvas');col.width=W;col.height=H;const cx=col.getContext('2d',{willReadFrequently:true});
const stk=document.createElement('canvas');stk.width=W;stk.height=H;const sx=stk.getContext('2d');
const lineImg=new Image();let mask=null;let page=0,tool='fill',style='solid',color=COLORS[0],sticker=STK[0];
let undo=[];
function sizeV(){return +document.getElementById('size').value}
// palette
const sw=document.getElementById('sw');COLORS.forEach((c,i)=>{const b=document.createElement('button');b.style.background=c;if(!i)b.className='on';
 b.onclick=()=>{color=c;[...sw.children].forEach(x=>x.className='');b.className='on';pop(600+i*20)};sw.appendChild(b)});
const st=document.getElementById('st');STK.forEach((e,i)=>{const s=document.createElement('span');s.textContent=e;if(!i)s.className='on';
 s.onclick=()=>{sticker=e;setTool('sticker');[...st.children].forEach(x=>x.className='');s.className='on'};st.appendChild(s)});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{style=b.dataset.style;document.querySelectorAll('[data-style]').forEach(x=>x.classList.toggle('on',x===b))});
function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('on',x.dataset.tool===t))}
// pages
const pg=document.getElementById('pages');PAGES.forEach((p,i)=>{const im=new Image();im.src=p.th;im.title=p.t;im.onclick=()=>load(i);pg.appendChild(im)});
function key(i){return 'digibydk-color-christmas-'+i}
function persist(){try{localStorage.setItem(key(page),JSON.stringify([col.toDataURL('image/webp',.85),stk.toDataURL('image/webp',.85)]))}catch(e){}}
function load(i){if(mask)persist();page=i;[...pg.children].forEach((x,k)=>x.className=k===i?'on':'');
 document.getElementById('ptitle').textContent=PAGES[i].t;document.getElementById('ex').src=PAGES[i].ex;
 cx.fillStyle='#fff';cx.fillRect(0,0,W,H);sx.clearRect(0,0,W,H);undo=[];
 lineImg.onload=()=>{const t=document.createElement('canvas');t.width=W;t.height=H;const tx=t.getContext('2d');tx.drawImage(lineImg,0,0,W,H);
  const d=tx.getImageData(0,0,W,H).data;mask=new Uint8Array(W*H);for(let k=0;k<W*H;k++)mask[k]=d[k*4]<128?1:0;
  let saved=null;try{saved=JSON.parse(localStorage.getItem(key(i)))}catch(e){}
  if(saved){const a=new Image(),b=new Image();let n=0;const go=()=>{if(++n<2)return;cx.drawImage(a,0,0);sx.drawImage(b,0,0);render()};a.onload=go;b.onload=go;a.src=saved[0];b.src=saved[1]}
  render()};
 lineImg.src=PAGES[i].line}
function render(){vx.globalCompositeOperation='source-over';vx.drawImage(col,0,0);vx.globalCompositeOperation='multiply';vx.drawImage(lineImg,0,0,W,H);
 vx.globalCompositeOperation='source-over';vx.drawImage(stk,0,0)}
function snap(){undo.push([cx.getImageData(0,0,W,H),sx.getImageData(0,0,W,H)]);if(undo.length>25)undo.shift()}
function hexrgb(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}
function hsl(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[255*f(0),255*f(8),255*f(4)]}
function shade(x,y,base){ // per-pixel color for fancy styles
 if(style==='rainbow')return hsl((x*0.6+y*0.25)%360,85,65);
 if(style==='glitter'){const r=Math.random();if(r<.06)return[255,255,255];if(r<.12)return base.map(v=>Math.min(255,v+70));return base.map(v=>v*(0.88+Math.random()*0.12))}
 if(style==='dots'){const gx=x%22-11,gy=y%22-11;return gx*gx+gy*gy<20?[255,255,255]:base}
 return base}
function fill(x0,y0){if(!mask)return;x0|=0;y0|=0;if(mask[y0*W+x0])return;snap();
 const img=cx.getImageData(0,0,W,H),d=img.data,base=hexrgb(color),seen=new Uint8Array(W*H),stack=[y0*W+x0],reg=[];seen[y0*W+x0]=1;
 while(stack.length){const p=stack.pop();reg.push(p);const x=p%W,y=(p/W)|0;
  for(const q of [x>0?p-1:-1,x<W-1?p+1:-1,y>0?p-W:-1,y<H-1?p+W:-1]){if(q<0||seen[q])continue;seen[q]=1;if(!mask[q])stack.push(q)}}
 // grow 2px under the lines so no white halos
 const grow=[];for(const p of reg){const x=p%W;for(const q of [p-1,p+1,p-W,p+W,p-2,p+2,p-2*W,p+2*W]){if(q>=0&&q<W*H&&!seen[q]&&mask[q]){seen[q]=1;grow.push(q)}}}
 for(const p of reg.concat(grow)){const c=shade(p%W,(p/W)|0,base);d[p*4]=c[0];d[p*4+1]=c[1];d[p*4+2]=c[2];d[p*4+3]=255}
 cx.putImageData(img,0,0);render();pop(500+Math.random()*400);persist()}
// pointer
let drawing=false,last=null;
function pos(e){const r=view.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
view.addEventListener('pointerdown',e=>{e.preventDefault();const [x,y]=pos(e);
 if(tool==='fill'){fill(x,y);return}
 if(tool==='sticker'){snap();sx.font=(sizeV()*3+30)+'px serif';sx.textAlign='center';sx.textBaseline='middle';sx.fillText(sticker,x,y);render();pop(900);persist();return}
 snap();drawing=true;last=[x,y];stroke(x,y)});
view.addEventListener('pointermove',e=>{if(!drawing)return;const [x,y]=pos(e);stroke(x,y)});
window.addEventListener('pointerup',()=>{if(drawing){drawing=false;persist()}});
function stroke(x,y){const c=tool==='erase'?'#ffffff':color;cx.lineCap='round';cx.lineJoin='round';cx.lineWidth=sizeV();
 if(tool!=='erase'&&style==='rainbow')cx.strokeStyle=`hsl(${(x*0.6+y*0.25)%360},85%,65%)`;else cx.strokeStyle=c;

 if(tool!=='erase'&&style==='glitter'){for(let i=0;i<3;i++){cx.fillStyle='#fff';cx.fillRect(x+(Math.random()-.5)*sizeV(),y+(Math.random()-.5)*sizeV(),2,2)}}

document.getElementById('undo').onclick=()=>{const u=undo.pop();if(u){cx.putImageData(u[0],0,0);sx.putImageData(u[1],0,0);render();persist()}};

function composite(){const o=document.createElement('canvas');o.width=W;o.height=H+70;const ox=o.getContext('2d');ox.fillStyle='#fff';ox.fillRect(0,0,o.width,o.height);
 ox.drawImage(view,0,0);ox.fillStyle='#c2457e';ox.font='bold 30px Fredoka, sans-serif';ox.textAlign='center';ox.fillText(PAGES[page].t+'  ·  DigiByDK',W/2,H+48);return o}
document.getElementById('save').onclick=()=>{const url=composite().toDataURL('image/png');const a=document.createElement('a');a.href=url;a.download=PAGES[page].t.replace(/[^a-z0-9]+/gi,'-')+'.png';document.body.appendChild(a);a.click();a.remove()};
document.getElementById('print').onclick=()=>{const im=document.getElementById('printimg');im.src=composite().toDataURL('image/png');im.onload=()=>window.print()};
document.getElementById('done').onclick=()=>{confetti();pop(700);setTimeout(()=>pop(900),120);setTimeout(()=>pop(1200),240)};
// sounds
let AC=null;function pop(f){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f,AC.currentTime);
 o.frequency.exponentialRampToValueAtTime(f*1.8,AC.currentTime+.08);g.gain.setValueAtTime(.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.18);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+.2)}catch(e){}}
// confetti
function confetti(){const c=document.getElementById('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const P=Array.from({length:160},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6.3,c:COLORS[(Math.random()*COLORS.length)|0],s:6+Math.random()*8}));
 let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
 if(++t<220)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
load(0);
</script></body></html>
